name: Checks

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'packaging/**', '.github/workflows/release.yml']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'packaging/**', '.github/workflows/release.yml']
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
          build-warnings: ''
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        working-directory: app/ui
        run: bun install --frozen-lockfile
      - name: Check frontend
        working-directory: app/ui
        run: bun run check
      - name: Build frontend assets for Tauri tests
        working-directory: app/ui
        run: bun run build
      - name: Test Rust workspace
        run: cargo test --workspace --locked
