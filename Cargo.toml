[package]
name = "meeting-recorder-windows"
version = "0.2.0"
edition = "2024"
publish = false

[[bin]]
name = "meeting-recorder"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = "0.18.2"
ctrlc = "3.4"
dirs = "6"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence"] }
ort = "2.0.0-rc.13"
realfft = "3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "multipart", "json", "rustls"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
toml = "1"
ureq = "3.4"

[dev-dependencies]
# Same version cpal already pulls in (see Cargo.lock). Used only by
# examples/audio_apps.rs to probe Core Audio sessions for the app that owns
# the system audio. Not linked into the recorder itself.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
