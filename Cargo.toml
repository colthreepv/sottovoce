[workspace]
members = ["app/src-tauri"]
resolver = "2"

[lib]
name = "sottovoce_engine"
path = "src/lib.rs"

[package]
name = "sottovoce-engine"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "sottovoce-dev-cli"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = "0.18.2"
ctrlc = "3.4"
dirs = "6"
ort = "2.0.0-rc.13"
realfft = "3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "multipart", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
toml = "1"
trash = "5"
ureq = "3.4"
# Core Audio session meters for the calling-app title (src/app_audio.rs).
# Same version cpal already pulls in (see Cargo.lock).
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
zip = { version = "6", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
